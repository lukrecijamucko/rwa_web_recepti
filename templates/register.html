<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>Registracija</title>
</head>
<body>

<h1>Registracija</h1>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="POST">

    <label>
        Username:
        <input type="text" name="username" required>
    </label>

    <br>

    <label>
        Email:
        <input type="email" name="email" required>
    </label>

    <br>

    <label>
        Password:
        <input type="password" name="password" required>
    </label>

    <br>

    <button type="submit">Registracija</button>

</form>

</body>
</html>
