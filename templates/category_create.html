{% extends '_layout.html' %}

{% block contents %}

<h2>Dodaj kategoriju</h2>

{% if error %}
    <p class="form-error">
        {{ error }}
    </p>
{% endif %}

<form method="POST">
    <label for="name">Naziv kategorije:</label>

    <input
        type="text"
        id="name"
        name="name"
        required
    >

    <button type="submit">
        Dodaj kategoriju
    </button>
</form>

{% endblock %}
