{% extends '_layout.html' %}

{% block contents %}

<h2>Moji recepti</h2>

{% if recipes %}

    {% for recipe in recipes %}

        <article>
            <h3>
                <a href="{{ url_for(
                    'recipes.show',
                    recipe_id=recipe.id
                ) }}">
                    {{ recipe.title }}
                </a>
            </h3>

            <p>
                {{ recipe.description }}
            </p>
        </article>

        <hr>

    {% endfor %}

{% else %}

    <p>Još nemate recepata.</p>

{% endif %}

<a href="{{ url_for('recipes.create') }}">
    + Dodaj recept
</a>

{% endblock %}
