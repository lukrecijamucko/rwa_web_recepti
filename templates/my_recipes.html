{% extends '_layout.html' %}

{% block contents %}

<h2>Moji recepti</h2>

<form method="GET" action="{{ url_for('recipes.index') }}">

    <label for="ingredient">
        Pretraži po sastojku:
    </label>

    <input
        type="text"
        id="ingredient"
        name="ingredient"
        value="{{ ingredient_name }}"
        placeholder="npr. brašno"
    >

    <button type="submit">
        Pretraži
    </button>

</form>

<br>

{% if recipes %}

    {% for recipe in recipes %}

        <article>
            <h3>
                <a href="{{ url_for(
                    'recipes.show',
                    recipe_id=recipe.id
                ) }}">
                    {{ recipe.title }}
                </a>
            </h3>

            <p>
                {{ recipe.description }}
            </p>
        </article>

        <hr>

    {% endfor %}

{% else %}

    <p>Još nemate recepata.</p>

{% endif %}

<a href="{{ url_for('recipes.create') }}">
    + Dodaj recept
</a>

{% endblock %}
